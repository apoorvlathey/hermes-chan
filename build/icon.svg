<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- HermesChan: a little winged chat bubble with bot eyes, on Hermes gold. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="0.55" stop-color="#F6C344"/>
      <stop offset="1" stop-color="#EBA62A"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F48"/>
      <stop offset="1" stop-color="#231C2E"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECFF"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A3A00" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3A2400" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle, centered, with ground shadow -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>

  <g filter="url(#soft)" transform="rotate(-6 512 530)">
    <!-- Hermes wing (behind the bubble, sweeping up and right from its shoulder) -->
    <g transform="translate(690 420) scale(0.86) translate(-690 -420)">
    <path d="M690 420
             C 730 330, 810 245, 905 190
             C 908 245, 893 285, 862 306
             C 884 318, 878 348, 846 364
             C 862 382, 846 404, 812 412
             C 818 432, 792 446, 760 444
             C 730 444, 705 435, 690 420 Z"
          fill="url(#wing)"/>
    <path d="M748 372 C 790 330, 830 290, 870 252 M770 400 C 800 375, 825 352, 846 332 M770 428 C 790 418, 806 404, 818 390"
          fill="none" stroke="#D9CCF2" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- chat bubble with tail -->
    <path d="M392 300
             H632
             a150 150 0 0 1 150 150
             V560
             a150 150 0 0 1 -150 150
             H430
             L318 788
             L340 690
             A150 150 0 0 1 242 560
             V450
             a150 150 0 0 1 150 -150 Z"
          fill="url(#bubble)"/>

    <!-- eyes -->
    <ellipse cx="434" cy="498" rx="40" ry="48" fill="#FFE07A"/>
    <ellipse cx="590" cy="498" rx="40" ry="48" fill="#FFE07A"/>
    <circle cx="447" cy="482" r="13" fill="#FFFFFF"/>
    <circle cx="603" cy="482" r="13" fill="#FFFFFF"/>

    <!-- smile + blush -->
    <path d="M478 590 Q512 622 546 590" fill="none" stroke="#FFE07A" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="368" cy="584" rx="28" ry="15" fill="#FF8FA3" opacity="0.45"/>
    <ellipse cx="656" cy="584" rx="28" ry="15" fill="#FF8FA3" opacity="0.45"/>
  </g>
</svg>
